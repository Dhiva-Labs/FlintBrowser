name: Build installers

# Builds the Linux and Windows installers for x64 and arm64, each on a runner
# of its own architecture (so native Node add-ons compile for the CPU they
# ship for), proves every package really is that architecture, runs the unit
# tests and the in-app smoke suite, and attaches the installers to a release.
#
#   * pull requests and pushes to main: build, verify and test everything.
#     Packages are kept as workflow artifacts; nothing is released.
#   * a pushed v* tag, or a manual run with `release_tag`: the same, then the
#     installers are uploaded to that GitHub release, which must already exist
#     (it is created by hand; this workflow only attaches files to it). A file
#     whose name is already on the release is skipped, never replaced.
#   * a manual run can build one architecture only, e.g. `arch: arm64` to add
#     arm64 installers to an existing release.
#
# Besides the release installers it builds the standard edition as a Microsoft
# Store MSIX (.appx) and as a snap, kept as workflow artifacts only: uploading
# to Partner Center and the Snap Store is done by hand.
#
# For other Linux distributions, each edition's .deb is repackaged as an .rpm
# (Fedora, RHEL, openSUSE), an Arch package, an AUR recipe and a Flatpak
# bundle; each is installed and run on its distribution, and they are
# attached to releases with the installers.

on:
  push:
    branches: [main, linux-distros]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload installers to (leave empty to only build)'
        required: false
        default: ''
      arch:
        description: 'Architectures to build'
        type: choice
        options: [all, x64, arm64]
        default: all

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # EasyList/EasyPrivacy are fetched and compiled once, here, and every
  # installer ships this same engine. (Fetching from each Windows job failed
  # intermittently with an undici assertion in Node, and a release should not
  # carry a different filter snapshot per package.)
  engine:
    name: Adblock engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only the filter-list compiler is needed, not Electron's download.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build adblock engine
        run: |
          for attempt in 1 2 3 4 5; do
            npm run build:engine && exit 0
            echo "::warning::adblock engine build failed (attempt $attempt of 5)"
            sleep $((attempt * 15))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: adblock-engine
          path: build/adblock-engine.bin
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.edition }})
    needs: engine
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, plus]
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}

      - name: Check the toolchain is ${{ matrix.arch }}
        run: |
          node -p "process.platform + '/' + process.arch + ', node ' + process.version"
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          uname -m

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Get the adblock engine
        uses: actions/download-artifact@v4
        with:
          name: adblock-engine
          path: build

      - name: Build icons
        run: npm run build:icons

      - name: Build ${{ matrix.edition }} packages
        run: node scripts/dist.js ${{ matrix.edition }}

      - name: Verify the packages are ${{ matrix.arch }}
        shell: bash
        run: |
          arch=${{ matrix.arch }}
          case "$arch" in
            x64)   deb_arch=amd64; appimage_arch=x86_64; file_arch='x86-64' ;;
            arm64) deb_arch=arm64; appimage_arch=arm64;  file_arch='ARM aarch64' ;;
          esac
          pkg=flint-browser${{ matrix.edition == 'plus' && '-plus' || '' }}
          ver=$(node -p "require('./package.json').version")
          deb="dist/$pkg-$ver-$deb_arch.deb"
          appimage="dist/$pkg-$ver-$appimage_arch.AppImage"
          tarball="dist/$pkg-$ver-$arch.tar.gz"
          for f in "$deb" "$appimage" "$tarball"; do
            test -f "$f" || { echo "::error::missing $f"; ls -l dist; exit 1; }
          done
          ls -l dist/*.deb dist/*.AppImage dist/*.tar.gz

          require=
          if [ "${{ matrix.edition }}" = plus ]; then require=--require=utp-native; fi

          # The unpacked app every package is made from.
          unpacked=(dist/linux*-unpacked)
          test "${#unpacked[@]}" -eq 1
          file "${unpacked[0]}/$pkg" "$appimage"
          file -b "${unpacked[0]}/$pkg" | grep -F "$file_arch"
          file -b "$appimage" | grep -F "$file_arch"
          node scripts/verify-arch.js "$arch" $require "${unpacked[0]}/$pkg" "${unpacked[0]}"

          # And what is inside each package format.
          test "$(dpkg-deb -f "$deb" Architecture)" = "$deb_arch"
          mkdir -p .tmp/deb .tmp/tar .tmp/appimage
          dpkg-deb -x "$deb" .tmp/deb
          node scripts/verify-arch.js "$arch" $require .tmp/deb
          tar -xzf "$tarball" -C .tmp/tar
          node scripts/verify-arch.js "$arch" $require .tmp/tar
          chmod +x "$appimage"
          (cd .tmp/appimage && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
          node scripts/verify-arch.js "$arch" $require .tmp/appimage/squashfs-root
          rm -rf .tmp

      - name: Install the .deb and run the smoke suite
        shell: bash
        timeout-minutes: 10
        env:
          FLINT_SMOKE_OUT: ${{ github.workspace }}/smoke-out
        run: |
          arch=${{ matrix.arch }}
          case "$arch" in x64) deb_arch=amd64 ;; arm64) deb_arch=arm64 ;; esac
          pkg=flint-browser${{ matrix.edition == 'plus' && '-plus' || '' }}
          ver=$(node -p "require('./package.json').version")
          sudo apt-get update
          sudo apt-get install -y xvfb "./dist/$pkg-$ver-$deb_arch.deb"
          command -v "$pkg"
          # Xvfb has no GPU: render in software so page captures are reliable.
          xvfb-run -a --server-args='-screen 0 1280x800x24' \
            "$(command -v "$pkg")" --no-sandbox --disable-gpu --smoke --profile-dir="$RUNNER_TEMP/flint-profile"

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-${{ matrix.arch }}-${{ matrix.edition }}
          path: smoke-out/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}-${{ matrix.edition }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Packages for distributions beyond Debian/Ubuntu, made from each edition's
  # .deb above: .rpm (Fedora, RHEL, openSUSE) and .pkg.tar.zst (Arch). Each
  # is installed on its real distribution and runs the in-app smoke suite
  # there (packaging/linux-distros/). The AppImage stays electron-builder's.
  distros:
    name: Other distros ${{ matrix.arch }} (${{ matrix.edition }})
    needs: linux
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, plus]
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    env:
      NFPM_VERSION: '2.48.0'
      EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}-${{ matrix.edition }}
          path: pkgs

      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build .rpm and Arch package
        run: |
          case "${{ matrix.arch }}" in x64) deb_arch=amd64 ;; arm64) deb_arch=arm64 ;; esac
          echo "DEB_ARCH=$deb_arch" >> "$GITHUB_ENV"
          . packaging/linux-distros/distro.conf
          ver=$(node -p "require('./package.json').version")
          packaging/linux-distros/deb-tree.sh "pkgs/$NAME-$ver-$deb_arch.deb" "$RUNNER_TEMP/root"
          VERSION="$ver" packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" "$deb_arch" dist
          # The Flatpak job builds from the same tree; tar keeps modes and symlinks.
          XZ_OPT='-T0 -3' tar -C "$RUNNER_TEMP/root" -cJf "$RUNNER_TEMP/tree.tar.xz" .

      - name: Install and run on Fedora, openSUSE and Arch
        timeout-minutes: 25
        run: packaging/linux-distros/verify.sh dist "$DEB_ARCH"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-distros-${{ matrix.arch }}-${{ matrix.edition }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: tree-${{ matrix.arch }}-${{ matrix.edition }}
          path: ${{ runner.temp }}/tree.tar.xz
          if-no-files-found: error
          retention-days: 3

  # AUR recipes: PKGBUILD + .SRCINFO for flint-browser-bin and
  # flint-browser-plus-bin, rendered with the checksums of this run's .debs
  # and proven with makepkg on archlinux:latest. They need both
  # architectures' .debs, so a run for one architecture skips them.
  aur:
    name: AUR PKGBUILD (${{ matrix.edition }})
    needs: linux
    if: inputs.arch == '' || inputs.arch == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, plus]
    env:
      EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*-${{ matrix.edition }}
          merge-multiple: true
          path: pkgs

      - name: Render and check the PKGBUILD
        run: |
          . packaging/linux-distros/distro.conf
          ver=$(node -p "require('./package.json').version")
          VERSION="$ver" packaging/arch/aur.sh "pkgs/$NAME-$ver-amd64.deb" "pkgs/$NAME-$ver-arm64.deb" dist

      - name: Upload the AUR recipe
        uses: actions/upload-artifact@v4
        with:
          name: release-aur-${{ matrix.edition }}
          path: dist/*-aur.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Flatpak bundles from the same trees, built with flatpak-builder in the
  # Flathub CI image (org.freedesktop.Platform 25.08 + Electron2.BaseApp).
  flatpak:
    name: Flatpak ${{ matrix.arch }} (${{ matrix.edition }})
    needs: distros
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, plus]
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tree-${{ matrix.arch }}-${{ matrix.edition }}
          path: ${{ runner.temp }}

      - name: Unpack the installed tree
        id: v
        run: |
          mkdir -p packaging/flatpak/tree
          tar -xJf "$RUNNER_TEMP/tree.tar.xz" -C packaging/flatpak/tree
          case "${{ matrix.edition }}" in
            standard) name=flint-browser; app_id=com.dhivalabs.flint ;;
            plus) name=flint-browser-plus; app_id=com.dhivalabs.flintplus ;;
          esac
          case "${{ matrix.arch }}" in x64) fp_arch=x86_64 ;; arm64) fp_arch=aarch64 ;; esac
          ver=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          newest=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' "packaging/flatpak/$app_id.metainfo.xml" | head -n 1)
          if [ "$newest" != "$ver" ]; then
            echo "::error::packaging/flatpak/$app_id.metainfo.xml: newest release $newest, package.json says $ver"
            exit 1
          fi
          {
            echo "name=$name"
            echo "app_id=$app_id"
            echo "fp_arch=$fp_arch"
            echo "version=$ver"
          } >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ steps.v.outputs.app_id }}.yml
          bundle: ${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}-${{ steps.v.outputs.fp_arch }}.flatpak
          artifact-name: release-flatpak-${{ matrix.arch }}-${{ matrix.edition }}
          arch: ${{ steps.v.outputs.fp_arch }}
          cache: false

  # Installs each bundle on a plain Ubuntu runner the way a user would (the
  # runtime and base app come from Flathub) and runs it in the sandbox.
  flatpak-test:
    name: Flatpak ${{ matrix.arch }} (${{ matrix.edition }}) install and run
    needs: flatpak
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, plus]
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-flatpak-${{ matrix.arch }}-${{ matrix.edition }}
          path: bundle

      - name: Install Flatpak and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak xvfb xauth dbus
          # bubblewrap needs unprivileged user namespaces, which Ubuntu 24.04
          # restricts through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the bundle and run it
        timeout-minutes: 20
        run: |
          case "${{ matrix.edition }}" in
            standard) packaging/flatpak/test-bundle.sh bundle/*.flatpak com.dhivalabs.flint flint-browser ;;
            plus) packaging/flatpak/test-bundle.sh bundle/*.flatpak com.dhivalabs.flintplus flint-browser-plus ;;
          esac

  windows:
    name: Windows ${{ matrix.arch }} (${{ matrix.edition }})
    needs: engine
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, plus]
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}

      - name: Check the toolchain is ${{ matrix.arch }}
        run: |
          node -p "process.platform + '/' + process.arch + ', node ' + process.version"
          test "$(node -p process.arch)" = "${{ matrix.arch }}"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Get the adblock engine
        uses: actions/download-artifact@v4
        with:
          name: adblock-engine
          path: build

      - name: Build icons
        run: npm run build:icons

      - name: Build ${{ matrix.edition }} installer
        run: node scripts/dist.js ${{ matrix.edition }}

      - name: Verify the installer and app are ${{ matrix.arch }}
        run: |
          arch=${{ matrix.arch }}
          pkg=flint-browser${{ matrix.edition == 'plus' && '-plus' || '' }}
          ver=$(node -p "require('./package.json').version")
          installer="dist/$pkg-$ver-$arch.exe"
          test -f "$installer" || { echo "::error::missing $installer"; ls -l dist; exit 1; }
          ls -l dist/*.exe

          require=
          if [ "${{ matrix.edition }}" = plus ]; then require=--require=utp-native; fi
          # electron-builder ships the same 32-bit x86 elevation helper for
          # every architecture (Windows on Arm runs it under emulation).
          elevate=--allow=resources/elevate.exe

          # The installer only unpacks this directory, so this is what ships.
          # (electron-builder's NSIS stub is a 32-bit x86 program on every
          # architecture, which Windows on Arm runs under emulation, so only
          # the application inside it is checked.)
          unpacked=(dist/win*-unpacked)
          test "${#unpacked[@]}" -eq 1
          exes=("${unpacked[0]}"/*.exe)
          test "${#exes[@]}" -eq 1
          node scripts/verify-arch.js "$arch" $require "$elevate" "${exes[0]}" "${unpacked[0]}"

      - name: Run the smoke suite
        timeout-minutes: 10
        env:
          FLINT_SMOKE_OUT: ${{ github.workspace }}\smoke-out
        run: |
          unpacked=(dist/win*-unpacked)
          exes=("${unpacked[0]}"/*.exe)
          "${exes[0]}" --smoke "--profile-dir=${{ runner.temp }}\flint-profile"

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-${{ matrix.arch }}-${{ matrix.edition }}
          path: smoke-out/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}-${{ matrix.edition }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      # Microsoft Store package: the standard edition only, unsigned (the Store
      # signs it). Built from a clean unpacked directory, as it renames the
      # executable to "Flint Browser.exe".
      - name: Build Microsoft Store package (MSIX)
        if: matrix.edition == 'standard'
        run: |
          rm -rf dist/win*-unpacked
          node scripts/dist.js standard --appx

      - name: Verify the Microsoft Store package is ${{ matrix.arch }}
        if: matrix.edition == 'standard'
        run: |
          arch=${{ matrix.arch }}
          ver=$(node -p "require('./package.json').version")
          appx="dist/flint-browser-$ver-$arch.appx"
          test -f "$appx" || { echo "::error::missing $appx"; ls -l dist; exit 1; }
          ls -l dist/*.appx
          unpacked=(dist/win*-unpacked)
          test "${#unpacked[@]}" -eq 1
          node scripts/verify-arch.js "$arch" --allow=resources/elevate.exe "${unpacked[0]}/Flint Browser.exe" "${unpacked[0]}"
          APPX="$appx" ARCH="$arch" pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:APPX).Path)
            try {
              $reader = New-Object IO.StreamReader($zip.GetEntry("AppxManifest.xml").Open())
              $manifest = [xml]$reader.ReadToEnd()
            } finally { $zip.Dispose() }
            $id = $manifest.Package.Identity
            $exe = $manifest.Package.Applications.Application.Executable
            "Identity: $($id.Name) $($id.Version) $($id.ProcessorArchitecture), executable $exe"
            if ($id.Name -ne "Dhiva-Labs.FlintBrowser") { throw "unexpected identity name $($id.Name)" }
            if ($id.ProcessorArchitecture -ne $env:ARCH) { throw "manifest says $($id.ProcessorArchitecture), expected $env:ARCH" }
          '

      - name: Upload Microsoft Store package
        if: matrix.edition == 'standard'
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: dist/*.appx
          if-no-files-found: error
          retention-days: 14

  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    steps:
      # The snap builds the commit pinned as source-commit in
      # snap/snapcraft.yaml, so the whole history has to be present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}

      - uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: --platform ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}

      - name: Verify the snap is ${{ matrix.arch }}
        run: |
          arch=${{ matrix.arch }}
          snap_arch=${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          snap="${{ steps.build.outputs.snap }}"
          case "$snap" in
            flint-browser_*_"$snap_arch".snap) ;;
            *) echo "::error::unexpected snap name $snap"; exit 1 ;;
          esac
          sudo unsquashfs -d "$RUNNER_TEMP/snapfs" "$snap" > /dev/null
          grep -A1 '^architectures:' "$RUNNER_TEMP/snapfs/meta/snap.yaml"
          grep -A1 '^architectures:' "$RUNNER_TEMP/snapfs/meta/snap.yaml" | grep -q -- "- $snap_arch"
          node scripts/verify-arch.js "$arch" "$RUNNER_TEMP/snapfs/opt/flint-browser/flint-browser" "$RUNNER_TEMP/snapfs/opt"

      - name: Install the snap and run the smoke suite
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          # No X authority file: a confined snap cannot read xvfb-run's.
          Xvfb :99 -screen 0 1280x800x24 -ac &
          export DISPLAY=:99
          snap run flint-browser --smoke --profile-dir="$HOME/snap/flint-browser/common/smoke-profile"

      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

  # The only job that can write to the repository: it attaches the installers
  # the jobs above built to the release.
  release:
    name: Upload installers to the release
    # aur is skipped on a run for one architecture; anything that failed
    # still stops the upload.
    needs: [linux, windows, distros, aur, flatpak-test]
    if: >-
      !cancelled() && !failure() && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      # Adds what the release lacks and leaves any file already on it alone, so
      # a release can carry hand-made assets, and a rerun or a run for one
      # architecture only never replaces files that are already there.
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          ls -l release-assets
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in release-assets/*; do
            name=$(basename "$file")
            if grep -qxF -- "$name" <<< "$existing"; then
              echo "skipping $name: already on the release"
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
