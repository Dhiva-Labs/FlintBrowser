<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src http: https: data:;">
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div id="chrome">
    <div id="tabstrip">
      <div id="incog-badge" hidden title="Private window"><svg viewBox="0 0 20 20"><path d="M3 9.5h14M5.5 9.5l1.3-4.2a1 1 0 0 1 1.2-.7l2 .5 2-.5a1 1 0 0 1 1.2.7l1.3 4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="13.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="13.5" cy="13.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.8 13.3c.8-.5 1.6-.5 2.4 0" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Private</span></div>
      <div id="tabs"></div>
      <button id="btn-newtab" title="New tab (Ctrl+T)"><svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <div id="drag-fill"></div>
      <div id="winctl">
        <button id="win-min" title="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button id="win-max" title="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button id="win-close" title="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg></button>
      </div>
    </div>
    <div id="toolbar">
      <button id="btn-back" title="Back (Alt+Left)" disabled><svg viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="btn-fwd" title="Forward (Alt+Right)" disabled><svg viewBox="0 0 20 20"><path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="btn-reload" title="Reload (Ctrl+R)"><svg id="ic-reload" viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 3v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><svg id="ic-stop" viewBox="0 0 20 20" hidden><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button id="btn-home" title="Home"><svg viewBox="0 0 20 20"><path d="M3.5 9.5L10 3.5l6.5 6v7h-4.5v-4.5h-4V16.5H3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <div id="omnibox">
        <span id="omni-icon" title=""></span>
        <div id="omni-field">
          <input id="omni" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
          <div id="omni-display" aria-hidden="true"></div>
        </div>
        <button id="btn-zoom" title="Reset zoom" hidden></button>
        <button id="btn-star" title="Bookmark (Ctrl+D)"><svg viewBox="0 0 20 20"><path id="star-path" d="M10 2.8l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L2.8 8l5-.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      </div>
      <button id="btn-shield" title="Ad &amp; tracker blocking"><svg viewBox="0 0 20 20"><path d="M10 2.5l6 2.2v4.6c0 3.8-2.6 6.6-6 8.2-3.4-1.6-6-4.4-6-8.2V4.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path class="shield-check" d="M7.3 10l1.9 1.9 3.6-3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="shield-count" hidden></span></button>
      <button id="btn-grabber" title="Download media on this page" hidden><svg viewBox="0 0 20 20"><path d="M4 5.5h12v9H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 8v4M12 8v4M8.5 10l3.5-2v4l-3.5-2z" fill="currentColor" stroke="currentColor" stroke-width="0.5"/></svg><span id="grab-count" hidden></span></button>
      <button id="btn-downloads" title="Downloads (Ctrl+J)"><svg viewBox="0 0 20 20"><path d="M10 3v9M6.5 8.5L10 12l3.5-3.5M4 16h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="dl-dot" hidden></span></button>
      <button id="btn-menu" title="Menu"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <div id="progress" hidden><div></div></div>
    </div>
  </div>
  <div id="overlay">
    <div id="suggestions" hidden></div>
    <div id="findbar" hidden>
      <input id="find-input" placeholder="Find in page">
      <span id="find-count"></span>
      <button id="find-prev" title="Previous (Shift+Enter)"><svg viewBox="0 0 20 20"><path d="M5 12.5L10 7.5l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="find-next" title="Next (Enter)"><svg viewBox="0 0 20 20"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="find-close" title="Close (Esc)"><svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    </div>
    <div id="shield-panel" hidden>
      <div class="sp-head">
        <svg viewBox="0 0 20 20"><path d="M10 2.5l6 2.2v4.6c0 3.8-2.6 6.6-6 8.2-3.4-1.6-6-4.4-6-8.2V4.7z" fill="currentColor"/></svg>
        <div class="sp-host" id="sp-host"></div>
      </div>
      <div class="sp-count"><b id="sp-count">0</b><span>ads &amp; trackers blocked on this page</span></div>
      <label class="sp-row" id="sp-toggle-row">
        <span>Block ads &amp; trackers on this site</span>
        <span class="switch"><input type="checkbox" id="sp-toggle"><span class="knob"></span></span>
      </label>
      <div class="sp-note" id="sp-note"></div>
      <button class="sp-clear" id="sp-clear" title="Removes this site's cookies and stored data, then reloads. Signs you out of it.">Clear cookies &amp; site data</button>
      <div class="sp-foot">
        <span id="sp-total"></span>
        <button id="sp-settings">Settings</button>
      </div>
    </div>
    <div id="toast" hidden></div>
  </div>
  <script src="chrome.js"></script>
</body>
</html>
