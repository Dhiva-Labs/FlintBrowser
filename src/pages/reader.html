<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src http: https: data:; media-src http: https:;">
  <title>Reader</title>
  <link rel="stylesheet" href="/pages.css">
</head>
<body data-page="reader">
  <div class="reader-bar">
    <button id="font-minus" class="small" title="Smaller text">A−</button>
    <button id="font-plus" class="small" title="Larger text">A+</button>
    <button id="theme-cycle" class="small" title="Toggle sepia">☼</button>
    <div class="grow"></div>
    <button id="open-original" class="small">Open original</button>
  </div>
  <div class="reader-wrap">
    <h1 class="title" id="title"></h1>
    <div class="reader-meta" id="meta"></div>
    <div id="article"></div>
  </div>
  <script src="/pages.js"></script>
</body>
</html>
