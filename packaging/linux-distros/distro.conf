# Package metadata for the other-distribution packages (.rpm, Arch package,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh, in-container.sh and packaging/arch/aur.sh, with EDITION set to
# standard or plus (the two editions dist.js builds). Keep it in step with
# the .deb, which electron-builder makes.

case "${EDITION:-}" in
  standard)
    NAME=flint-browser
    PRODUCT='Flint'            # electron-builder installs to /opt/<product name>
    SUMMARY='Fast private browser with built-in ad blocking'
    ;;
  plus)
    NAME=flint-browser-plus
    PRODUCT='Flint Plus'
    SUMMARY='Fast private browser with adblock, BitTorrent and media tools'
    ;;
  *) echo "set EDITION to standard or plus" >&2; return 2 2> /dev/null || exit 2 ;;
esac
GITHUB_REPO=Dhiva-Labs/FlintBrowser
TAG_PREFIX=v                 # release tags are v1.2.3
DESCRIPTION='Flint is a fast, private desktop web browser by Dhiva Labs with ad and tracker blocking, secure DNS, turbo downloads and reader mode built in, and zero telemetry.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/FlintBrowser
LICENSE=MIT
LICENSE_FILE=LICENSE
# The app's private directory: the packages own it and everything below.
OWN_DIRS=("opt/$PRODUCT")

# rpm: libraries the ELF files link are derived from them. These are the
# .deb's Depends that Electron loads at run time instead of linking (GTK,
# libnotify, libsecret, ...) as soname capabilities, so Fedora and openSUSE
# both resolve them, plus xdg-open, which the browser runs.
RPM_REQUIRES=(
  'libgtk-3.so.0()(64bit)'
  'libnotify.so.4()(64bit)'
  'libnss3.so()(64bit)'
  'libXss.so.1()(64bit)'
  'libXtst.so.6()(64bit)'
  'libatspi.so.0()(64bit)'
  'libuuid.so.1()(64bit)'
  'libsecret-1.so.0()(64bit)'
  /usr/bin/xdg-open
)
# Arch: the same, plus what Electron links that gtk3 does not pull in.
ARCH_DEPENDS=(gtk3 nss alsa-lib mesa libnotify libxss libxtst xdg-utils at-spi2-core util-linux-libs libsecret)
ARCH_INDEPENDENT=0

# The AppImage stays electron-builder's own (build-installers.yml).
APPIMAGE=0

# Smoke tests in each distribution container, as shell commands. Electron
# refuses to run as root without --no-sandbox, and the containers run as
# root; Xvfb has no GPU. SMOKE_CMD is the in-app smoke suite (navigation,
# adblock, stores, internal pages, downloads), GUI_CMD a plain start that
# must still be running after SMOKE_SECONDS.
SMOKE_CMD="xvfb-run -a -s '-screen 0 1280x800x24' $NAME --no-sandbox --disable-gpu --smoke --profile-dir=/tmp/flint-smoke-profile"
GUI_CMD="$NAME --no-sandbox --disable-gpu --profile-dir=/tmp/flint-profile"
SMOKE_SECONDS=20
